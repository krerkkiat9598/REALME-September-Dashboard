const f=n=>Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0}),m=n=>"฿"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0}),p=n=>Number.isFinite(Number(n))?(Number(n)*100).toFixed(1)+"%":"—",e=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
function K(a,b,c=""){return `<div class="card"><div class="lab">${a}</div><div class="val">${b}</div><div class="small">${c}</div></div>`}
function S(){return `<div class="scope"><b>DATA SCOPE</b> — Actual ${D.meta.actual_period} • Target ${D.meta.target_period} • Source: <b>${e(D.meta.actual_source)}</b> • Target/PC/Stock joined from supporting files. <b>Excel is read through the LIVE local API at runtime.</b></div>`}
function N(){document.getElementById("nav").innerHTML=[["exec","Executive"],["model","Model Analytics"],["shop","Drilldown"],["game","Gameplan"],["stock","Stock"],["data","Data Engine"]].map(x=>`<button class="${P==x[0]?"on":""}" onclick="P='${x[0]}';R()">${x[1]}</button>`).join("")}
function exec(){let s=D.summary,q=s.actual_qty/s.aug_qty-1,n=s.actual_net/s.aug_net-1;return S()+`<div class="grid">${K("Actual Qty",f(s.actual_qty),"Sep 1–4")}${K("Actual Net Amount",m(s.actual_net),"Sep 1–4")}${K("Target Qty",f(s.target_qty),"Full Sep target")}${K("Achievement",p(s.actual_qty/s.target_qty),"Qty vs target")}</div><div class="grid" style="margin-top:12px">${K("Gap Qty",f(s.actual_qty-s.target_qty),"MTD vs full-month target")}${K("MoM Qty",p(q),q>=0?"Growing":"Declining")}${K("MoM Net Amount",p(n),n>=0?"Growing":"Declining")}${K("Raw Run Rate",f(s.runrate_qty)+" Qty / "+m(s.runrate_net),"sum of Sep row run-rate fields")}</div><div class="sec">Model Movement</div><div class="tw"><table class="tbl"><tr><th>Model</th><th>Target</th><th>Actual</th><th>Ach.</th><th>MoM Qty</th><th>MoM Net</th><th>Stock</th></tr>${D.models.slice(0,12).map(r=>`<tr><td>${e(r.MODEL_CLEAN)}</td><td class="rt">${f(r.TARGET_QTY)}</td><td class="rt">${f(r.ACTUAL_QTY)}</td><td class="rt">${p(r.ACHIEVEMENT)}</td><td class="rt ${r.MOM_QTY>=0?"good":"bad"}">${p(r.MOM_QTY)}</td><td class="rt ${r.MOM_NET>=0?"good":"bad"}">${p(r.MOM_NET)}</td><td class="rt">${f(r.STOCK_QTY)}</td></tr>`).join("")}</table></div><div class="sec">Management Signals</div><div class="ins"><b>Target-base selling:</b> ${f(s.target_selling_shops)} / ${f(s.active_shops)} shops • <b>No sale:</b> ${f(s.no_sale_active_shops)} shops.</div><div class="ins"><b>Outside base:</b> ${f(s.outside_base_qty)} Qty / ${m(s.outside_base_net)} — excluded from Gameplan reward.</div>`}
function model(){return S()+`<div class="sec">Model Analytics — every model</div><div class="toolbar"><input id="mq" placeholder="Search model..." oninput="mf()"></div><div class="tw"><table class="tbl" id="mt"><tr><th>Model</th><th>Target Qty</th><th>Actual Qty</th><th>Ach.</th><th>Gap</th><th>Target Net</th><th>Actual Net</th><th>MoM Qty</th><th>MoM Net</th><th>ASP</th><th>Stock</th></tr>${D.models.map(r=>`<tr><td>${e(r.MODEL_CLEAN)}</td><td class="rt">${f(r.TARGET_QTY)}</td><td class="rt">${f(r.ACTUAL_QTY)}</td><td class="rt">${p(r.ACHIEVEMENT)}</td><td class="rt">${f(r.GAP)}</td><td class="rt">${m(r.TARGET_NET)}</td><td class="rt">${m(r.ACTUAL_NET)}</td><td class="rt ${r.MOM_QTY>=0?"good":"bad"}">${p(r.MOM_QTY)}</td><td class="rt ${r.MOM_NET>=0?"good":"bad"}">${p(r.MOM_NET)}</td><td class="rt">${m(r.ASP)}</td><td class="rt">${f(r.STOCK_QTY)}</td></tr>`).join("")}</table></div>`}
function mf(){let q=mq.value.toLowerCase();document.querySelectorAll("#mt tr:not(:first-child)").forEach(r=>r.style.display=r.cells[0].innerText.toLowerCase().includes(q)?"":"none")}
function shop(){let rg=[...new Set(D.shops.map(x=>x.REGION).filter(Boolean))],ar=[...new Set(D.shops.map(x=>x.ZONE_AREA).filter(Boolean))];return S()+`<div class="toolbar"><select id="rg" onchange="sf()"><option value="">All Region</option>${rg.map(x=>`<option>${e(x)}</option>`).join("")}</select><select id="ar" onchange="sf()"><option value="">All Area/Zone</option>${ar.map(x=>`<option>${e(x)}</option>`).join("")}</select><select id="pc" onchange="sf()"><option value="">All PC Type</option><option>PC</option><option>No PC</option></select><input id="sq" placeholder="Shop code/name" oninput="sf()"></div><div class="tw"><table class="tbl" id="st"><tr><th>Region</th><th>Area/Zone</th><th>Shop Type</th><th>Shop</th><th>PC Type</th><th>Target</th><th>Actual</th><th>Ach.</th><th>Gap</th><th>Actual Net</th><th>Status</th></tr>${D.shops.map(r=>`<tr data-r="${e(r.REGION)}" data-a="${e(r.ZONE_AREA)}" data-p="${e(r.PC_TYPE)}"><td>${e(r.REGION)}</td><td>${e(r.ZONE_AREA)}</td><td>${e(r.SHOP_TYPE)}</td><td>${e(r.SHOP_NAME)}</td><td>${e(r.PC_TYPE)}</td><td class="rt">${f(r.TARGET_QTY)}</td><td class="rt">${f(r.ACTUAL_QTY)}</td><td class="rt">${p(r.ACHIEVEMENT)}</td><td class="rt">${f(r.GAP)}</td><td class="rt">${m(r.ACTUAL_NET)}</td><td>${r.ACTUAL_QTY>0?'<span class="good">SELLING</span>':'<span class="bad">NO SALE</span>'}</td></tr>`).join("")}</table></div>`}
function sf(){let R=rg.value,A=ar.value,C=pc.value,Q=sq.value.toLowerCase();document.querySelectorAll("#st tr:not(:first-child)").forEach(x=>x.style.display=(!R||x.dataset.r==R)&&(!A||x.dataset.a==A)&&(!C||x.dataset.p==C)&&x.cells[3].innerText.toLowerCase().includes(Q)?"":"none")}
function game(){let rows=D.shops;return S()+`<div class="grid">${K("Active Base",f(D.summary.active_shops),"107 target shops")}${K("PC",f(D.summary.pc_shops),"40 Qty → ฿1,000")}${K("No PC",f(D.summary.no_pc_shops),"4 Qty → ฿100 ladder")}${K("Outside Base",f(D.summary.outside_base_qty)+" Qty","excluded")}</div><div class="sec">Gameplan — Active Target Base</div><div class="tw"><table class="tbl"><tr><th>Shop</th><th>PC Type</th><th>Target</th><th>Actual</th><th>Progress to 40</th><th>Reward</th></tr>${rows.map(r=>{let a=+r.ACTUAL_QTY||0,step=r.PC_TYPE.toUpperCase()=="PC"?40:4,rew=Math.floor(a/step)*100;return `<tr><td>${e(r.SHOP_NAME)}</td><td>${e(r.PC_TYPE)}</td><td class="rt">${f(r.TARGET_QTY)}</td><td class="rt">${f(a)}</td><td><div class="bar"><i style="width:${Math.min(100,a/40*100)}%"></i></div>${f(a)}/40</td><td>${a>=40?'<span class="good">฿1,000 achieved</span>':a>=4?'<span class="warn">฿'+f(rew)+' potential</span>':'<span class="bad">No reward yet</span>'}</td></tr>`}).join("")}</table></div>`}
function stock(){return S()+`<div class="grid">${K("Total Realme Stock",f(D.summary.stock_total),"as of 05/09/2026")}${K("Stock Models",f(D.models.filter(x=>x.STOCK_QTY>0).length),"models with stock")}${K("High Stock / Low Sales",f(D.models.filter(x=>x.STOCK_QTY>100&&x.ACTUAL_QTY<5).length),"opportunity")}${K("Target + Zero Stock",f(D.models.filter(x=>x.STOCK_QTY==0&&x.TARGET_QTY>0).length),"OOS risk")}</div><div class="sec">Stock Opportunity by Model</div><div class="tw"><table class="tbl"><tr><th>Model</th><th>Stock</th><th>Target</th><th>Actual</th><th>Ach.</th><th>Signal</th></tr>${[...D.models].sort((a,b)=>b.STOCK_QTY-a.STOCK_QTY).map(r=>{let s=r.STOCK_QTY>100&&r.ACTUAL_QTY<5?"HIGH STOCK / LOW SALES":r.STOCK_QTY==0&&r.TARGET_QTY>0?"OOS RISK":r.ACTUAL_QTY>=r.TARGET_QTY?"ON TRACK":"OPPORTUNITY";return `<tr><td>${e(r.MODEL_CLEAN)}</td><td class="rt">${f(r.STOCK_QTY)}</td><td class="rt">${f(r.TARGET_QTY)}</td><td class="rt">${f(r.ACTUAL_QTY)}</td><td class="rt">${p(r.ACHIEVEMENT)}</td><td>${s}</td></tr>`}).join("")}</table></div>`}
function data(){return S()+`<div class="sec">Data Engine</div><div class="card"><b>GitHub Pages Snapshot</b><p>This version runs directly from GitHub Pages without a local Python API.</p><p class="note">Data snapshot generated: ${e(D.meta.generated_at)}</p><p class="note">For live Excel refresh, we will connect a secure backend in the next phase.</p></div>`}
function R(){N();document.getElementById("app").innerHTML={exec,model,shop,game,stock,data}[P]()}function boot(){ R(); }
boot();
